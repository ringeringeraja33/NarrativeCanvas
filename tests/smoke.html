<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Narrative Canvas Smoke Test</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
      }

      iframe {
        width: 1180px;
        height: 760px;
        border: 1px solid #555;
      }

      #smoke-report {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body data-smoke-status="running">
    <h1>Narrative Canvas Smoke Test</h1>
    <pre id="smoke-report">running</pre>
    <script>
      const report = {
        startedAt: new Date().toISOString(),
        tests: [],
        failures: []
      };
      const WEB_STORAGE_KEY = "narrative-canvas-state-v1";
      const WEB_LANGUAGE_STORAGE_KEY = "narrative-canvas-language-v1";

      function record(name, status, detail = "") {
        report.tests.push({ name, status, detail });
      }

      function pass(name, detail = "") {
        record(name, "pass", detail);
      }

      function fail(name, detail = "") {
        record(name, "fail", detail);
        report.failures.push({ name, detail });
      }

      function assert(name, condition, detail = "") {
        if (condition) pass(name, detail);
        else fail(name, detail);
      }

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function waitFor(name, predicate, timeout = 4000, getDetail = null) {
        const started = performance.now();
        while (performance.now() - started < timeout) {
          if (predicate()) {
            pass(name);
            return true;
          }
          await wait(50);
        }
        const detail = typeof getDetail === "function" ? getDetail() : "";
        fail(name, detail ? `Timed out; ${detail}` : "Timed out");
        return false;
      }

      function setControlValue(win, element, value) {
        element.focus();
        element.value = value;
        element.dispatchEvent(new win.Event("input", { bubbles: true }));
        element.dispatchEvent(new win.Event("change", { bubbles: true }));
      }

      function setControlInputValue(win, element, value) {
        element.focus();
        element.value = value;
        element.dispatchEvent(new win.Event("input", { bubbles: true }));
      }

      function click(element) {
        const targetWindow = element.ownerDocument.defaultView;
        element.dispatchEvent(new targetWindow.MouseEvent("click", {
          bubbles: true,
          cancelable: true,
          composed: true,
          detail: 1,
          view: targetWindow
        }));
      }

      function getPortHitInfo(doc, port) {
        if (!port) return null;
        const viewport = doc.querySelector("#canvasViewport");
        const viewportRect = viewport?.getBoundingClientRect();
        const rect = port.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const hit = doc.elementFromPoint(cx, cy);
        return {
          port,
          rect,
          hit,
          inViewport: Boolean(viewportRect
            && cx >= viewportRect.left
            && cx <= viewportRect.right
            && cy >= viewportRect.top
            && cy <= viewportRect.bottom),
          isHitTarget: hit?.closest("[data-port]") === port
        };
      }

      function findClickablePort(doc, kind, excludeNodeId = "", predicate = () => true) {
        return [...doc.querySelectorAll(`.port.${kind}[data-node-id]`)]
          .map((port) => getPortHitInfo(doc, port))
          .find((info) => info
            && info.inViewport
            && info.isHitTarget
            && !doc.querySelector(`.node.frame[data-node-id='${info.port.dataset.nodeId}']`)
            && (!excludeNodeId || info.port.dataset.nodeId !== excludeNodeId)
            && predicate(info.port));
      }

      function isElementHidden(win, element) {
        if (!element) return true;
        const style = win.getComputedStyle(element);
        return Boolean(element.closest("[hidden]")) || element.hidden || style.display === "none" || style.visibility === "hidden";
      }

      function isTransparentColor(value) {
        return value === "transparent" || value === "rgba(0, 0, 0, 0)";
      }

      function hasHiddenBorder(style, side) {
        const prefix = `border${side}`;
        return style[`${prefix}Width`] === "0px" || isTransparentColor(style[`${prefix}Color`]);
      }

      function hasCollapsedToggleRule(doc) {
        try {
          return [...doc.styleSheets].some((sheet) => [...sheet.cssRules]
            .some((rule) => String(rule.cssText || "").includes("sidebar-toggle-button[aria-expanded=\"false\"]")));
        } catch (error) {
          return false;
        }
      }

      function verticalCentersAligned(first, second, tolerance = 2) {
        const firstRect = first.getBoundingClientRect();
        const secondRect = second.getBoundingClientRect();
        const firstCenter = firstRect.top + firstRect.height / 2;
        const secondCenter = secondRect.top + secondRect.height / 2;
        return Math.abs(firstCenter - secondCenter) <= tolerance;
      }

      function verticalCenterDetail(first, second) {
        const firstRect = first.getBoundingClientRect();
        const secondRect = second.getBoundingClientRect();
        return `left=${(firstRect.top + firstRect.height / 2).toFixed(1)} right=${(secondRect.top + secondRect.height / 2).toFixed(1)}`;
      }

      function parseRgb(value) {
        const match = String(value || "").match(/rgba?\(([^)]+)\)/i);
        if (!match) return null;
        const parts = match[1].split(/,\s*/).map((part) => Number.parseFloat(part));
        if (parts.length < 3 || parts.some((part) => Number.isNaN(part))) return null;
        return parts.slice(0, 3);
      }

      function relativeLuminance(rgb) {
        return rgb
          .map((channel) => {
            const value = channel / 255;
            return value <= 0.03928 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
          })
          .reduce((sum, value, index) => sum + value * [0.2126, 0.7152, 0.0722][index], 0);
      }

      function contrastRatio(colorA, colorB) {
        const rgbA = parseRgb(colorA);
        const rgbB = parseRgb(colorB);
        if (!rgbA || !rgbB) return 0;
        const light = Math.max(relativeLuminance(rgbA), relativeLuminance(rgbB));
        const dark = Math.min(relativeLuminance(rgbA), relativeLuminance(rgbB));
        return (light + 0.05) / (dark + 0.05);
      }

      function assertReadableLightThemeToggle(label, win, button, stateName) {
        const style = win.getComputedStyle(button);
        const contrast = contrastRatio(style.color, style.backgroundColor);
        const background = parseRgb(style.backgroundColor) || [0, 0, 0];
        const isLightBackground = Math.min(...background) >= 220;
        assert(
          `${label}: theme toggle ${stateName} state is readable on light background`,
          contrast >= 4.5 && isLightBackground,
          `contrast=${contrast.toFixed(2)} color=${style.color} bg=${style.backgroundColor}`
        );
      }

      function getProjectFrameTypes(project) {
        return new Set((project?.nodeTypes || [])
          .filter((typeDef) => typeDef.kind === "frame")
          .map((typeDef) => typeDef.type));
      }

      function getRenderedNodeSize(doc, nodeId) {
        const element = doc.querySelector(`.node[data-node-id='${nodeId}']`);
        return {
          width: Number.parseFloat(element?.style.width || "0") || element?.getBoundingClientRect?.().width || 0,
          height: Number.parseFloat(element?.style.height || "0") || element?.getBoundingClientRect?.().height || 0
        };
      }

      function getProjectNodeSize(doc, node, fallback = {}) {
        const rendered = getRenderedNodeSize(doc, node?.id || "");
        return {
          width: Number(node?.width) || fallback.width || rendered.width || 0,
          height: Number(node?.height) || fallback.height || rendered.height || 0
        };
      }

      function findVisibleFrameCanvasCase(win, doc) {
        const project = win.NarrativeCanvasApp.getSavedState()?.project || {};
        const frameTypes = getProjectFrameTypes(project);
        const frames = (project.nodes || []).filter((node) => frameTypes.has(node.type) && !node.collapsed);
        for (const frame of frames) {
          const frameElement = doc.querySelector(`.node.frame[data-node-id='${frame.id}']`);
          const openButton = frameElement?.querySelector("[data-action='open-frame-canvas']");
          if (!frameElement || !openButton) continue;
          const child = (project.nodes || []).find((node) => node.frameId === frame.id && !frameTypes.has(node.type));
          if (child) return { frame, child, openButton };
        }
        return null;
      }

      async function verifyFrameCanvasDragContainment(label, win, doc) {
        click(doc.querySelector("[data-file-id='adventure']"));
        await waitFor(`${label}: canvas opens before frame canvas containment check`, () => doc.querySelector(".app-shell")?.getAttribute("data-active-file") === "adventure");
        const candidate = findVisibleFrameCanvasCase(win, doc);
        if (!candidate) {
          assert(`${label}: frame canvas containment test has a visible frame with child`, false);
          return;
        }
        const beforeProject = win.NarrativeCanvasApp.getSavedState()?.project || {};
        const beforeFrame = (beforeProject.nodes || []).find((node) => node.id === candidate.frame.id);
        const beforeFrameSize = getProjectNodeSize(doc, beforeFrame);
        click(candidate.openButton);
        await waitFor(`${label}: frame canvas opens for containment check`, () => doc.querySelector(".app-shell")?.getAttribute("data-frame-canvas") === "true");
        const childElement = doc.querySelector(`.node[data-node-id='${candidate.child.id}']`);
        const childHeader = childElement?.querySelector("[data-drag-handle]");
        const childHeaderRect = childHeader?.getBoundingClientRect();
        const childSizeBefore = getRenderedNodeSize(doc, candidate.child.id);
        if (!childHeaderRect) {
          assert(`${label}: frame canvas child is draggable`, false);
          return;
        }
        const startX = childHeaderRect.left + Math.min(80, childHeaderRect.width / 2);
        const startY = childHeaderRect.top + childHeaderRect.height / 2;
        const endX = startX - 180;
        const endY = startY - 120;
        const viewport = doc.querySelector("#canvasViewport");
        childHeader.dispatchEvent(new win.PointerEvent("pointerdown", {
          bubbles: true,
          cancelable: true,
          pointerId: 121,
          button: 0,
          buttons: 1,
          clientX: startX,
          clientY: startY
        }));
        viewport.dispatchEvent(new win.PointerEvent("pointermove", {
          bubbles: true,
          cancelable: true,
          pointerId: 121,
          button: 0,
          buttons: 1,
          clientX: endX,
          clientY: endY
        }));
        viewport.dispatchEvent(new win.PointerEvent("pointerup", {
          bubbles: true,
          cancelable: true,
          pointerId: 121,
          button: 0,
          clientX: endX,
          clientY: endY
        }));
        await wait(120);
        click(doc.querySelector("#frameCanvasExitButton"));
        await waitFor(`${label}: frame canvas exits after containment drag`, () => !doc.querySelector(".app-shell")?.hasAttribute("data-frame-canvas"));
        const afterProject = win.NarrativeCanvasApp.getSavedState()?.project || {};
        const frameAfter = (afterProject.nodes || []).find((node) => node.id === candidate.frame.id);
        const childAfter = (afterProject.nodes || []).find((node) => node.id === candidate.child.id);
        const frameSize = getProjectNodeSize(doc, frameAfter, beforeFrameSize);
        const childSize = getProjectNodeSize(doc, childAfter, childSizeBefore);
        const contains = frameAfter && childAfter
          && childAfter.x >= frameAfter.x - 1
          && childAfter.y >= frameAfter.y - 1
          && childAfter.x + childSize.width <= frameAfter.x + frameSize.width + 1
          && childAfter.y + childSize.height <= frameAfter.y + frameSize.height + 1;
        assert(
          `${label}: frame canvas drag keeps child visually contained after exit`,
          contains,
          `frame=${frameAfter?.x},${frameAfter?.y},${frameSize.width},${frameSize.height} child=${childAfter?.x},${childAfter?.y},${childSize.width},${childSize.height}`
        );
      }

      async function verifyCanvasRadialMenu(label, win, doc) {
        click(doc.querySelector("[data-file-id='adventure']"));
        await waitFor(`${label}: canvas opens before radial menu check`, () => doc.querySelector(".app-shell")?.getAttribute("data-active-file") === "adventure");
        const viewport = doc.querySelector("#canvasViewport");
        const viewportRect = viewport?.getBoundingClientRect();
        let clientX = viewportRect.left + 32;
        let clientY = viewportRect.top + 32;
        let blankTarget = null;
        outer: for (let y = viewportRect.top + 32; y < viewportRect.bottom - 32; y += 44) {
          for (let x = viewportRect.left + 32; x < viewportRect.right - 32; x += 44) {
            const stack = typeof doc.elementsFromPoint === "function" ? doc.elementsFromPoint(x, y) : [];
            const occupied = stack.some((element) => element.closest?.(".node[data-node-id], [data-port], [data-link-id]"));
            if (!occupied) {
              clientX = x;
              clientY = y;
              blankTarget = stack.find((element) => viewport.contains(element)) || viewport;
              break outer;
            }
          }
        }
        assert(`${label}: radial menu test finds blank canvas point`, Boolean(blankTarget));
        if (!blankTarget) return;
        const beforeProject = win.NarrativeCanvasApp.getSavedState()?.project || {};
        const beforeCount = beforeProject.nodes?.length || 0;
        blankTarget.dispatchEvent(new win.MouseEvent("contextmenu", {
          bubbles: true,
          cancelable: true,
          view: win,
          clientX,
          clientY
        }));
        const radialMenu = doc.querySelector("#canvasRadialMenu");
        await waitFor(`${label}: blank canvas right-click opens radial menu`, () => radialMenu && !radialMenu.hidden);
        assert(`${label}: radial menu is one four-segment semicircle`, radialMenu?.querySelectorAll(".radial-arc .radial-button").length === 4);
        const addButton = radialMenu.querySelector("[data-radial-toggle='add']");
        assert(`${label}: radial menu exposes Add`, Boolean(addButton));
        if (!addButton) return;
        click(addButton);
        await waitFor(`${label}: radial Add expands Node Library`, () => !radialMenu.querySelector(".radial-add-list")?.hidden);
        const addList = radialMenu.querySelector(".radial-add-list");
        assert(`${label}: radial add list is labelled as Node Library`, addList?.getAttribute("aria-label") === "Node Library");
        const markerItem = addList?.querySelector("[data-action='add-node'][data-type='Marker']")
          || addList?.querySelector("[data-action='add-node']");
        if (!markerItem) {
          assert(`${label}: radial add list has node type items`, false);
          return;
        }
        const spawnX = Number(markerItem?.dataset.spawnX);
        const spawnY = Number(markerItem?.dataset.spawnY);
        assert(`${label}: radial add item carries spawn point`, Number.isFinite(spawnX) && Number.isFinite(spawnY));
        click(markerItem);
        await waitFor(`${label}: radial add creates node`, () => {
          const project = win.NarrativeCanvasApp.getSavedState()?.project || {};
          return (project.nodes?.length || 0) === beforeCount + 1;
        });
        assert(`${label}: radial menu closes after add`, radialMenu.hidden);
        const saved = win.NarrativeCanvasApp.getSavedState();
        const createdId = saved?.ui?.selectedNodeId;
        const createdNode = saved?.project?.nodes?.find((node) => node.id === createdId);
        assert(`${label}: radial add selects created node`, Boolean(createdNode));
        assert(`${label}: radial add uses selected node type`, createdNode?.type === markerItem?.dataset.type);
        assert(
          `${label}: radial add places node near right-click point`,
          createdNode && Math.abs((createdNode.x + 70) - spawnX) < 260 && Math.abs((createdNode.y + 70) - spawnY) < 160,
          `spawn=${spawnX},${spawnY} node=${createdNode?.x},${createdNode?.y}`
        );
      }

      async function verifyFrameContextMenu(label, win, doc) {
        let frame = doc.querySelector(".node.frame[data-node-id]");
        if (!frame) {
          assert(`${label}: frame context-menu fixture exists`, false);
          return;
        }
        const frameId = frame.dataset.nodeId;
        // Frame header right-click opens the layer/delete menu.
        let frameHeader = frame.querySelector(".node-header");
        let headerRect = frameHeader.getBoundingClientRect();
        frameHeader.dispatchEvent(new win.MouseEvent("contextmenu", {
          bubbles: true,
          cancelable: true,
          view: win,
          clientX: headerRect.left + headerRect.width / 2,
          clientY: headerRect.top + headerRect.height / 2
        }));
        const menu = doc.querySelector("#nodeContextMenu");
        await waitFor(`${label}: frame header right-click opens context menu`, () => menu && !menu.hidden);
        assert(`${label}: frame context menu exposes layer actions`, menu?.querySelectorAll("[data-layer-action]").length === 4);
        assert(`${label}: frame context menu exposes frame deletion`, Boolean(menu?.querySelector("[data-action='delete-node']")) && menu.textContent.includes("Delete frame"));
        doc.body.dispatchEvent(new win.PointerEvent("pointerdown", { bubbles: true }));
        await wait(80);

        // Frame body right-click behaves like blank canvas: radial quick menu.
        frame = doc.querySelector(`.node.frame[data-node-id='${frameId}']`) || frame;
        const rect = frame.getBoundingClientRect();
        frame.dispatchEvent(new win.MouseEvent("contextmenu", {
          bubbles: true,
          cancelable: true,
          view: win,
          clientX: rect.left + rect.width * 0.7,
          clientY: rect.top + rect.height * 0.7
        }));
        const frameRadialMenu = doc.querySelector("#canvasRadialMenu");
        await waitFor(`${label}: frame body right-click opens radial menu`, () => frameRadialMenu && !frameRadialMenu.hidden);
        doc.body.dispatchEvent(new win.PointerEvent("pointerdown", { bubbles: true }));
      }

      async function verifyProjectDocument(label, win, doc) {
        async function verifyNoopRoundTrip(formatLabel) {
          const sourceEditor = doc.querySelector("#documentPanel [data-document-source]");
          const before = JSON.stringify(win.NarrativeCanvasApp.getSavedState()?.project || {});
          setControlValue(win, sourceEditor, `${sourceEditor?.value || ""}\n`);
          await waitFor(`${label}: ${formatLabel} no-op source reaches synced state`, () => doc.querySelector("[data-document-sync-status]")?.dataset.status === "synced");
          const after = JSON.stringify(win.NarrativeCanvasApp.getSavedState()?.project || {});
          assert(`${label}: ${formatLabel} no-op round-trip preserves project JSON`, after === before);
        }

        const documentFile = doc.querySelector("[data-file-id='document']");
        assert(`${label}: Document file tab exists`, Boolean(documentFile));
        click(documentFile);
        await waitFor(`${label}: Document file opens`, () => doc.querySelector(".app-shell")?.getAttribute("data-active-file") === "document");
        const editor = doc.querySelector("#documentPanel [data-document-source]");
        assert(`${label}: Document source editor renders`, Boolean(editor));
        const documentHeader = doc.querySelector("#documentPanel .document-project-header.document-header");
        const documentExport = documentHeader?.querySelector("[data-action='export-current-document']");
        const documentChromeToggle = doc.querySelector("#documentPanel [data-action='toggle-document-chrome']");
        assert(`${label}: Document uses the shared file header style`, Boolean(documentHeader));
        assert(`${label}: Document header exposes current-format export`, documentExport?.textContent.includes("MD"));
        assert(`${label}: Document header collapse uses an upward chevron`, documentChromeToggle?.getAttribute("aria-expanded") === "true" && Boolean(documentChromeToggle.querySelector("svg.document-chrome-chevron path")));
        const documentChrome = doc.querySelector("#documentPanel .document-source-chrome");
        const chromeHeightBeforeCollapse = documentChrome?.getBoundingClientRect().height || 0;
        click(documentChromeToggle);
        await waitFor(`${label}: Document header collapses`, () => doc.querySelector("#documentPanel .document-source-shell")?.dataset.documentChrome === "collapsed");
        const collapsedChromeToggle = doc.querySelector("#documentPanel [data-action='toggle-document-chrome']");
        assert(`${label}: collapsed Document hides the file header`, isElementHidden(win, documentHeader));
        assert(`${label}: collapsed Document keeps a visible restore control`, collapsedChromeToggle?.getAttribute("aria-expanded") === "false" && !isElementHidden(win, collapsedChromeToggle));
        const chromeHeightAfterCollapse = documentChrome?.getBoundingClientRect().height || 0;
        assert(
          `${label}: collapsed Document reduces the editor chrome`,
          chromeHeightAfterCollapse < chromeHeightBeforeCollapse - 40,
          `before=${chromeHeightBeforeCollapse.toFixed(1)} after=${chromeHeightAfterCollapse.toFixed(1)}`
        );
        click(collapsedChromeToggle);
        await waitFor(`${label}: Document header expands`, () => doc.querySelector("#documentPanel .document-source-shell")?.dataset.documentChrome === "expanded");
        assert(`${label}: expanded Document restores the file header`, !isElementHidden(win, documentHeader));
        assert(`${label}: Document offers four source formats`, doc.querySelectorAll("#documentPanel [data-document-format]").length === 4);
        const originalSource = editor?.value || "";
        assert(`${label}: plain document marks exact body boundaries`, originalSource.includes("<!-- narrativeCanvasBody:start -->") && originalSource.includes("<!-- narrativeCanvasBody:end -->"));
        const originalTitle = win.NarrativeCanvasApp.getSavedState()?.project?.title || "";
        const editedSource = originalSource.replace(/^#\s+.+$/m, "# Document Smoke Title");
        setControlValue(win, editor, editedSource);
        await waitFor(`${label}: plain document edit syncs to project`, () => win.NarrativeCanvasApp.getSavedState()?.project?.title === "Document Smoke Title");
        setControlValue(win, editor, originalSource);
        await waitFor(`${label}: plain document edit can be restored`, () => win.NarrativeCanvasApp.getSavedState()?.project?.title === originalTitle);
        await verifyNoopRoundTrip("plain");
        const originalMarkerBody = win.NarrativeCanvasApp.getSavedState()?.project?.nodes?.find((node) => node.id === "n19")?.body || "";
        const markerBody = "Body markers preserve structural-looking prose.\n## This stays inside the node body\nchoices:\n<<set $literal = 1>>";
        const markerBodyPattern = /(<!-- id: n19 -->[\s\S]*?<!-- narrativeCanvasBody:start -->\n)([\s\S]*?)(\n<!-- narrativeCanvasBody:end -->)/;
        const markerEditedSource = originalSource.replace(markerBodyPattern, `$1${markerBody}$3`);
        assert(`${label}: plain marker-node body can be located safely`, markerEditedSource !== originalSource);
        setControlValue(win, editor, markerEditedSource);
        await waitFor(`${label}: plain body markers preserve headings and script-like lines`, () => win.NarrativeCanvasApp.getSavedState()?.project?.nodes?.find((node) => node.id === "n19")?.body === markerBody);
        setControlValue(win, editor, originalSource);
        await waitFor(`${label}: plain body edit can be restored exactly`, () => win.NarrativeCanvasApp.getSavedState()?.project?.nodes?.find((node) => node.id === "n19")?.body === originalMarkerBody);
        const beforeBrokenMarker = JSON.stringify(win.NarrativeCanvasApp.getSavedState()?.project || {});
        setControlValue(win, editor, originalSource.replace("<!-- narrativeCanvasBody:end -->", "<!-- body marker being edited -->"));
        await waitFor(`${label}: incomplete Document structure reports source error`, () => doc.querySelector("[data-document-sync-status]")?.dataset.status === "error");
        assert(`${label}: incomplete Document structure cannot mutate project`, JSON.stringify(win.NarrativeCanvasApp.getSavedState()?.project || {}) === beforeBrokenMarker);
        setControlValue(win, editor, originalSource);
        await waitFor(`${label}: corrected Document structure returns to synced`, () => doc.querySelector("[data-document-sync-status]")?.dataset.status === "synced");

        click(doc.querySelector("#documentPanel [data-document-format='ink']"));
        await waitFor(`${label}: Ink document renders`, () => doc.querySelector("#documentPanel [data-document-format='ink']")?.classList.contains("active"));
        assert(`${label}: Ink header updates filename and export label`, doc.querySelector("#documentPanel .document-project-header h2")?.textContent === "Document.ink" && doc.querySelector("#documentPanel [data-action='export-current-document']")?.textContent.includes("Ink"));
        const inkSource = doc.querySelector("#documentPanel [data-document-source]")?.value || "";
        assert(`${label}: Ink document carries stable node ids`, inkSource.includes("// narrativeCanvasId:"));
        assert(`${label}: Ink document carries editable node titles and body boundaries`, inkSource.includes("// nodeTitle:") && inkSource.includes("// narrativeCanvasBody:start"));
        assert(`${label}: Ink document preserves project notes and complex variables`, inkSource.includes("// narrativeCanvasNotes:") && inkSource.includes("// narrativeCanvasVariable: sample_metadata ="));
        await verifyNoopRoundTrip("Ink");
        const originalFeatureTags = win.NarrativeCanvasApp.getSavedState()?.project?.variables?.feature_tags || [];
        const inkListMatch = inkSource.match(/^VAR feature_tags = \(([^)]*)\)$/m);
        const inkListItems = (inkListMatch?.[1] || "").split(",").map((item) => item.trim()).filter(Boolean);
        assert(`${label}: Ink document exposes typed list metadata`, inkSource.includes("// narrativeCanvasListValues: feature_tags =") && inkListItems.length >= 3);
        const shortenedInkSource = inkSource.replace(inkListMatch?.[0] || "", `VAR feature_tags = (${inkListItems.slice(0, 2).join(", ")})`);
        setControlValue(win, doc.querySelector("#documentPanel [data-document-source]"), shortenedInkSource);
        await waitFor(`${label}: Ink list edit syncs typed array values`, () => win.NarrativeCanvasApp.getSavedState()?.project?.variables?.feature_tags?.length === 2);
        setControlValue(win, doc.querySelector("#documentPanel [data-document-source]"), inkSource);
        await waitFor(`${label}: Ink list edit restores exact typed array`, () => JSON.stringify(win.NarrativeCanvasApp.getSavedState()?.project?.variables?.feature_tags) === JSON.stringify(originalFeatureTags));
        click(doc.querySelector("#documentPanel [data-document-format='yarn']"));
        await waitFor(`${label}: Yarn document renders`, () => doc.querySelector("#documentPanel [data-document-format='yarn']")?.classList.contains("active"));
        const yarnSource = doc.querySelector("#documentPanel [data-document-source]")?.value || "";
        assert(`${label}: Yarn document carries stable node ids`, yarnSource.includes("narrativeCanvasId:"));
        assert(`${label}: Yarn document carries editable node titles and body boundaries`, yarnSource.includes("nodeTitle:") && yarnSource.includes("// narrativeCanvasBody:start"));

      function extractBodyHtml(html) {
        const match = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        const bodyHtml = match ? match[1] : html;
        return bodyHtml
          .replace(/<script\b[\s\S]*?<\/script>/gi, "")
          .replace(/<link\b[^>]*rel=["']stylesheet["'][^>]*>/gi, "");
      }

      const projectBaseUrl = new URL("../", window.location.href);
      const assetVersion = new URL(window.location.href).searchParams.get("run") || String(Date.now());

      function assetUrl(path) {
        const url = new URL(path, projectBaseUrl);
        url.searchParams.set("run", assetVersion);
        return url.href;
      }

      function scopeCanvasCss(source) {
        const keyframes = [];
        let css = source
          .replace(/:root/g, ".narrative-canvas-plugin-host")
          .replace(/(^|})\s*html\s*,\s*body\s*{/g, "$1\n.narrative-canvas-plugin-host {")
          .replace(/(^|})\s*body\s*{/g, "$1\n.narrative-canvas-plugin-host {");

        css = css.replace(/@keyframes\s+[-_a-zA-Z0-9]+\s*{(?:[^{}]|{[^{}]*})*}/g, (match) => {
          const token = `__NARRATIVE_CANVAS_KEYFRAMES_${keyframes.length}__`;
          keyframes.push(match);
          return token;
        });

        css = css.replace(/(^|[{}])\s*([^@{}][^{]+)\s*{/g, (match, boundary, selectorText) => {
          const selectors = selectorText
            .split(",")
            .map((selector) => selector.trim())
            .filter(Boolean)
            .map((selector) => selector.startsWith(".narrative-canvas-plugin-host")
              ? selector
              : `.narrative-canvas-plugin-host ${selector}`);

          return `${boundary}\n${selectors.join(", ")} {`;
        });

        return css.replace(/__NARRATIVE_CANVAS_KEYFRAMES_(\d+)__/g, (_match, index) => keyframes[Number(index)] || "");
      }

      async function loadWebFrame() {
        window.localStorage?.removeItem(WEB_STORAGE_KEY);
        window.localStorage?.removeItem(WEB_LANGUAGE_STORAGE_KEY);
        const frame = document.createElement("iframe");
        frame.title = "web smoke target";
        frame.src = `${assetUrl("index.html")}?smoke=${Date.now()}`;
        await new Promise((resolve, reject) => {
          const timeoutId = setTimeout(() => reject(new Error("Web smoke iframe load timed out")), 5000);
          frame.addEventListener("load", () => {
            clearTimeout(timeoutId);
            resolve();
          }, { once: true });
          frame.addEventListener("error", () => {
            clearTimeout(timeoutId);
            reject(new Error("Web smoke iframe failed to load"));
          }, { once: true });
          document.body.append(frame);
        });
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        await waitFor("web app ready", () => Boolean(win.NarrativeCanvasApp && doc.querySelector(".app-shell[data-theme]")));
        return { frame, win, doc };
      }

      async function loadPluginFrame(options = {}) {
        const [html, css, appJs] = await Promise.all([
          fetch(assetUrl("index.html")).then((response) => response.text()),
          fetch(assetUrl("canvas.css")).then((response) => response.text()),
          fetch(assetUrl("app.js")).then((response) => response.text())
        ]);
        const frame = document.createElement("iframe");
        frame.title = "plugin smoke target";
        document.body.append(frame);
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        doc.open();
        doc.write("<!doctype html><html><head><meta charset=\"utf-8\"><title>Plugin Host Smoke</title></head><body></body></html>");
        doc.close();

        const style = doc.createElement("style");
        style.textContent = scopeCanvasCss(css);
        doc.head.append(style);

        const host = doc.createElement("div");
        host.className = "narrative-canvas-plugin-host";
        host.innerHTML = extractBodyHtml(html);
        doc.body.append(host);

        let ensuredProjectPath = "";
        let newProjectIndex = 0;
        win.__sampleEnsureOptions = null;
        win.__saveProjectCalls = [];
        win.__createdProjectPaths = [];
        win.__createdProjectStates = [];
        win.__createdProjectOptions = [];
        win.NarrativeCanvasHost = {
          root: host,
          loadProject: async () => null,
          saveProject: async (savedStateJson) => {
            win.__saveProjectCalls.push(savedStateJson);
            ensuredProjectPath = "Smoke.ncanvas";
            return ensuredProjectPath;
          },
          getLanguage: () => options.language || "en",
          getAutoSaveIntervalMs: () => 1000,
          ensureProjectFile: async (_savedStateJson, options) => {
            win.__sampleEnsureOptions = options || null;
            ensuredProjectPath = options?.filenameOverride || "Sample-smoke.ncanvas";
            return ensuredProjectPath;
          },
          createProjectFile: async (savedStateJson, options = {}) => {
            newProjectIndex += 1;
            const title = options.filenameProjectTitle || "Untitled";
            ensuredProjectPath = `${title}-smoke-${newProjectIndex}.ncanvas`;
            win.__createdProjectPaths.push(ensuredProjectPath);
            win.__createdProjectStates.push(JSON.parse(savedStateJson));
            win.__createdProjectOptions.push(options);
            return ensuredProjectPath;
          },
          previewNewProjectFile: async (_savedStateJson, options = {}) => `${options.filenameProjectTitle || "Untitled"}-smoke-${newProjectIndex + 1}.ncanvas`,
          getProjectFile: () => ensuredProjectPath
        };

        const script = doc.createElement("script");
        script.textContent = appJs;
        doc.body.append(script);
        await win.NarrativeCanvasApp.init();
        await waitFor("plugin app ready", () => Boolean(doc.querySelector(".narrative-canvas-plugin-host .app-shell[data-theme]")));
        return { frame, win, doc };

          canvasDialogLine.dispatchEvent(new win.Event("change", { bubbles: true }));
          await win.NarrativeCanvasApp.save({ silent: true });
          assert(`${label}: Dialog card line edit reaches saved project`, readSavedProject(win)?.project?.nodes?.find((item) => item.id === "n6")?.turns?.[0]?.line === "Edited dialog line on canvas");
          canvasDialogSpeaker = doc.querySelector(".node[data-node-id='n6'] .node-dialog-speaker-input");
          setControlValue(win, canvasDialogSpeaker, "Edited speaker");
          await win.NarrativeCanvasApp.save({ silent: true });
          assert(`${label}: Dialog card speaker edit reaches saved project`, readSavedProject(win)?.project?.nodes?.find((item) => item.id === "n6")?.turns?.[0]?.speaker === "Edited speaker");
          canvasDialogLine = doc.querySelector(".node[data-node-id='n6'] .node-dialog-line-input");
          canvasDialogSpeaker = doc.querySelector(".node[data-node-id='n6'] .node-dialog-speaker-input");
          setControlValue(win, canvasDialogLine, originalLine);
          canvasDialogSpeaker = doc.querySelector(".node[data-node-id='n6'] .node-dialog-speaker-input");
          setControlValue(win, canvasDialogSpeaker, originalSpeaker);
        }
        const dialogPreview = doc.querySelector(".node[data-node-id='n6'] .node-dialog-preview");
        const dialogPreviewClones = Array.from({ length: 16 }, () => dialogPreview?.lastElementChild?.cloneNode(true)).filter(Boolean);
        dialogPreviewClones.forEach((item) => dialogPreview.append(item));
        const dialogPreviewStyle = win.getComputedStyle(dialogPreview);
        assert(`${label}: Dialog card scrolls long turn lists`, dialogPreviewStyle.overflowY === "auto" && dialogPreview.scrollHeight > dialogPreview.clientHeight + 1, `overflowY=${dialogPreviewStyle.overflowY} scroll=${dialogPreview.scrollHeight} client=${dialogPreview.clientHeight}`);
        assert(`${label}: Dialog card contains scroll chaining`, dialogPreviewStyle.overscrollBehaviorY === "contain" || dialogPreviewStyle.overscrollBehavior === "contain", `overscroll=${dialogPreviewStyle.overscrollBehavior}`);
        assert(`${label}: Dialog card scroll area is keyboard focusable`, dialogPreview.tabIndex === 0 && dialogPreview.getAttribute("role") === "region");
        dialogPreviewClones.forEach((item) => item.remove());
        const dialogTurnsEditor = doc.querySelector(".dialog-turns-editor");
        assert(`${label}: Add turn remains below the turn list`, dialogTurnsEditor?.querySelector(".dialog-turns-list")?.nextElementSibling?.classList.contains("dialog-turns-footer"));
        await verifyCanvasRadialMenu(label, win, doc);
        await verifyFrameContextMenu(label, win, doc);
        await verifyInspectorFloatAndPlaySync(label, win, doc);
        await verifyProjectDocument(label, win, doc);

        const status = doc.querySelector(".status-bar").getBoundingClientRect();
        const workspace = doc.querySelector(".canvas-workspace").getBoundingClientRect();
        const search = doc.querySelector(".canvas-search-box").getBoundingClientRect();
        assert(`${label}: status bar stays inside workspace`, status.left >= workspace.left - 1 && status.right <= workspace.right + 1);
        assert(`${label}: bottom search starts in workspace`, search.left >= workspace.left - 1);

        if (win.__saveProjectCalls) {
          const beforeAutoSaveCalls = win.__saveProjectCalls.length;
          const projectTitleInput = doc.querySelector("[data-project-field='title']");
          setControlValue(win, projectTitleInput, `${projectTitleInput.value} Autosave`);
          assert(`${label}: save state changes to unsaved after edit`, doc.querySelector("#projectDirtyIndicator")?.dataset.saveState === "unsaved");
          await waitFor(`${label}: auto-save writes project`, () => win.__saveProjectCalls.length > beforeAutoSaveCalls, 3500);
          await waitFor(`${label}: auto-save returns to saved state`, () => doc.querySelector("#projectDirtyIndicator")?.dataset.saveState === "saved", 1000);
        }

        if (win.__createdProjectPaths) {
          const newButton = doc.querySelector("[data-action='new-project']");
          click(newButton);
          await waitFor(`${label}: new project dialog opens`, () => doc.querySelector("#confirmDialog")?.open);
          const newProjectNameInput = doc.querySelector("#newProjectNameInput");
          assert(`${label}: new project dialog has name input`, Boolean(newProjectNameInput));
          setControlValue(win, newProjectNameInput, "Smoke Draft");
          click(doc.querySelector("#confirmDialog [value='confirm']"));
          await waitFor(`${label}: new project vault file created`, () => win.__createdProjectPaths.length > 0);
          const createdPath = win.__createdProjectPaths[0];
          await waitFor(`${label}: project file card switches to new file`, () => doc.querySelector("#projectFileName")?.textContent === createdPath);
          assert(`${label}: new project create receives filename title`, win.__createdProjectOptions[0]?.filenameProjectTitle === "Smoke Draft");
          assert(`${label}: new project save JSON uses input title`, win.__createdProjectStates[0]?.project?.title === "Smoke Draft");
          assert(`${label}: new project starts without sample characters`, Array.isArray(win.__createdProjectStates[0]?.project?.characters) && win.__createdProjectStates[0].project.characters.length === 0);
          assert(
            `${label}: new project starts without default variables`,
            win.__createdProjectStates[0]?.project?.variables
              && !Array.isArray(win.__createdProjectStates[0].project.variables)
              && Object.keys(win.__createdProjectStates[0].project.variables).length === 0
          );
          assert(`${label}: new project title uses input`, doc.querySelector("#vaultProjectTitle")?.textContent === "Smoke Draft");
          assert(`${label}: new project save state is saved after file creation`, doc.querySelector("#projectDirtyIndicator")?.dataset.saveState === "saved");
          click(doc.querySelector("[data-file-id='characters']"));
          await waitFor(`${label}: new project characters page re-renders`, () => doc.querySelector("#charactersPanel")?.textContent.includes("No characters yet."));
          assert(`${label}: new project characters page drops sample names`, !doc.querySelector("#charactersPanel")?.textContent.includes("Co-writer"));
          await verifyCanDeleteAllCharactersAndVariables(label, win, doc);

          click(doc.querySelector("[data-file-id='events']"));
          await waitFor(`${label}: empty events page opens`, () => doc.querySelector("#eventsPanel")?.textContent.includes("No visible frame nodes yet."));
          doc.querySelector("#eventsPanel [data-action='add-node'][data-type='Event']")?.click();
          await waitFor(`${label}: Add frame works from empty events page`, () => doc.querySelector(".app-shell")?.getAttribute("data-active-file") === "adventure" && doc.body.textContent.includes("Frame"));

          click(doc.querySelector("[data-file-id='variables']"));
          await waitFor(`${label}: playbook page opens after empty project`, () => Boolean(doc.querySelector("#variablesPanel [data-action='select-playbook-tab'][data-playbook-tab='rules']")));
          await waitFor(`${label}: Add variable button is ready after empty project`, () => Boolean(doc.querySelector("#variablesPanel [data-action='add-variable']")));
          const emptyProjectVariableRowsBeforeAdd = doc.querySelectorAll("#variablesPanel .variable-row:not(.variable-heading)").length;
          click(doc.querySelector("#variablesPanel [data-action='add-variable']"));
          await waitFor(`${label}: Add variable works from playbook`, () => doc.querySelectorAll("#variablesPanel .variable-row:not(.variable-heading)").length === emptyProjectVariableRowsBeforeAdd + 1);
          click(doc.querySelector("#variablesPanel [data-action='select-playbook-tab'][data-playbook-tab='rules']"));
        await waitFor(`${label}: play rules tab opens after empty project`, () => doc.querySelector("#variablesPanel")?.textContent.includes("Start Node"));
          const endConditionEditor = doc.querySelector("[data-runner-rule-field='endCondition']");
          assert(`${label}: end condition uses a resizable multiline editor`, endConditionEditor?.tagName === "TEXTAREA" && getComputedStyle(endConditionEditor).resize === "vertical");
          click(doc.querySelector("#variablesPanel [data-action='add-play-rule']"));
          await waitFor(`${label}: Add play rule dialog opens`, () => doc.querySelector("#playRuleDialog")?.open);
          doc.querySelector("#playRuleDialog [data-action='create-play-rule'][data-playbook-rule-kind='debugMode']")?.click();
          await waitFor(`${label}: Add play rule creates rule`, () => doc.querySelector("#variablesPanel")?.textContent.includes("Debug Mode"));
        } else if (clearStorageButton) {
          const previousConfirm = win.confirm;
          win.confirm = () => true;
          click(clearStorageButton);
          await waitFor(`${label}: clear browser storage confirm opens`, () => doc.querySelector("#genericConfirmDialog")?.open);
          click(doc.querySelector("#genericConfirmDialog [value='confirm']"));
          await waitFor(`${label}: clear browser storage saves blank project`, () => {
            const saved = readSavedProject(win);
            return saved?.project?.title === "Untitled"
              && saved.project.nodes?.length === 1
              && saved.project.characters?.length === 0
              && saved.project.variables
              && Object.keys(saved.project.variables).length === 0;
          });
          win.confirm = previousConfirm;
          assert(`${label}: clear browser storage selects blank entry`, doc.querySelector("#vaultProjectTitle")?.textContent === "Untitled");
          await verifyCanDeleteAllCharactersAndVariables(label, win, doc);
        }
      }

      async function runLanguageChecks() {
        const target = await loadPluginFrame({ language: "zh" });
        const { win, doc, frame } = target;
        assert("plugin zh: root language set", doc.querySelector(".app-shell")?.getAttribute("lang") === "zh-CN");
        assert("plugin zh: save button translated", doc.querySelector("[data-action='save-project']")?.textContent.trim() === "保存");
        assert("plugin zh: project file heading translated", doc.querySelector(".project-file-section h2")?.textContent.trim() === "项目文件");
        assert("plugin zh: node search placeholder translated", doc.querySelector("#queryInput")?.getAttribute("placeholder") === "查找节点");
        assert("plugin zh: node template options translated", [...(doc.querySelector("#customNodeKind")?.options || [])].map((option) => option.textContent.trim()).join("|") === "基础节点|对话|选择|框架");
        assert("plugin zh: node type dialog template options translated", [...(doc.querySelector("#nodeTypeKindInput")?.options || [])].map((option) => option.textContent.trim()).join("|") === "基础节点|对话|选择|框架");
        win.NarrativeCanvasApp.executeCommand("open-events");
        await wait(80);
        click(doc.querySelector("[data-action='delete-event-column']"));
        await wait(40);
        assert("plugin zh: event column delete dialog title translated", /^删除“.+”列？$/.test(doc.querySelector("#eventColumnDeleteTitle")?.textContent.trim() || ""));
        assert("plugin zh: event column delete dialog body translated", doc.querySelector("#eventColumnDeleteBody")?.textContent.includes("隐藏只会隐藏该列并保留数据"));
        click(doc.querySelector("#eventColumnDeleteDialog [value='cancel']"));
        win.NarrativeCanvasApp.setLanguage("en");
        await wait(80);
        assert("plugin language: can switch back to English", doc.querySelector("[data-action='save-project']")?.textContent.trim() === "Save");
        assert("plugin en: node template options restored", [...(doc.querySelector("#customNodeKind")?.options || [])].map((option) => option.textContent.trim()).join("|") === "Basic Node|Dialog|Choice|Frame");
        assert("plugin en: node type dialog template options restored", [...(doc.querySelector("#nodeTypeKindInput")?.options || [])].map((option) => option.textContent.trim()).join("|") === "Basic Node|Dialog|Choice|Frame");
        win.NarrativeCanvasApp.destroy?.();
        frame.remove();
      }

      async function runCustomTemplateChecks() {
        const target = await loadPluginFrame();
        const { win, doc, frame } = target;
        const label = "plugin templates";
        const customTemplateSelect = doc.querySelector("#customNodeKind");
        const customTemplateValues = [...customTemplateSelect.options].map((option) => option.value);
        assert(`${label}: custom node form offers specialized templates`, ["node", "dialog", "choice", "frame"].every((value) => customTemplateValues.includes(value)));
        click(doc.querySelector("[data-action='edit-node-type-badge'][data-node-type='Choice']"));
        await waitFor(`${label}: Choice type dialog opens`, () => Boolean(doc.querySelector("#nodeTypeDialog")?.open));
        assert(`${label}: Choice type uses the Choice template`, doc.querySelector("#nodeTypeKindInput")?.value === "choice" && Boolean(doc.querySelector("#nodeTypeBuiltinFields [data-node-type-built-in-field='choices']")));
        doc.querySelector("#nodeTypeDialog")?.close("cancel");
        click(doc.querySelector("[data-action='edit-node-type-badge'][data-node-type='Dialog']"));
        await waitFor(`${label}: Dialog type dialog opens`, () => Boolean(doc.querySelector("#nodeTypeDialog")?.open));
        assert(`${label}: Dialog type uses the Dialog template`, doc.querySelector("#nodeTypeKindInput")?.value === "dialog" && Boolean(doc.querySelector("#nodeTypeBuiltinFields [data-node-type-built-in-field='turns']")));
        doc.querySelector("#nodeTypeDialog")?.close("cancel");
        setControlValue(win, doc.querySelector("#customNodeName"), "Smoke Choice Type");
        setControlValue(win, customTemplateSelect, "choice");
        click(doc.querySelector("[data-action='add-custom-node-type']"));
        await waitFor(`${label}: custom Choice template is added`, () => [...doc.querySelectorAll("[data-action='add-node']")].some((button) => button.textContent.includes("Smoke Choice Type")));
        const customChoiceButton = [...doc.querySelectorAll("[data-action='add-node']")].find((button) => button.textContent.includes("Smoke Choice Type"));
        click(customChoiceButton);
        await waitFor(`${label}: custom Choice template creates a specialized node`, () => Boolean(doc.querySelector(".node.selected .node-choice-preview") && doc.querySelector("#nodePanel .choice-options-editor")));
        setControlValue(win, doc.querySelector("#customNodeName"), "Smoke Dialog Type");
        setControlValue(win, customTemplateSelect, "dialog");
        click(doc.querySelector("[data-action='add-custom-node-type']"));
        await waitFor(`${label}: custom Dialog template is added`, () => [...doc.querySelectorAll("[data-action='add-node']")].some((button) => button.textContent.includes("Smoke Dialog Type")));
        const customDialogButton = [...doc.querySelectorAll("[data-action='add-node']")].find((button) => button.textContent.includes("Smoke Dialog Type"));
        click(customDialogButton);
        await waitFor(`${label}: custom Dialog template creates a specialized node`, () => Boolean(doc.querySelector("#nodePanel .dialog-turns-editor")));
        await win.NarrativeCanvasApp.save({ silent: true });
        const templateProject = readSavedProject(win)?.project;
        assert(`${label}: custom specialized templates persist`, templateProject?.nodeTypes?.some((typeDef) => typeDef.label === "Smoke Choice Type" && typeDef.template === "choice") && templateProject?.nodeTypes?.some((typeDef) => typeDef.label === "Smoke Dialog Type" && typeDef.template === "dialog"));
        win.NarrativeCanvasApp.destroy?.();
        frame.remove();
      }

      async function runWebLanguageChecks() {
        const target = await loadWebFrame();
        const { win, doc, frame } = target;
        win.NarrativeCanvasApp.setLanguage("zh");
        await wait(80);
        click(doc.querySelector("[data-action='clear-browser-storage']"));
        await waitFor("web zh: clear browser storage dialog opens", () => doc.querySelector("#genericConfirmDialog")?.open);
        assert("web zh: clear storage title translated", doc.querySelector("#genericConfirmTitle")?.textContent.trim() === "清除浏览器存储？");
        assert(
          "web zh: clear storage body translated",
          doc.querySelector("#genericConfirmBody")?.textContent.trim() === "清除浏览器存储并载入空项目？这会删除当前浏览器中保存的项目。"
        );
        assert("web zh: clear storage confirm translated", doc.querySelector("#genericConfirmButton")?.textContent.trim() === "清除存储");
        assert("web zh: clear storage cancel translated", doc.querySelector("#genericConfirmDialog .confirm-cancel")?.textContent.trim() === "取消");
        doc.querySelector("#genericConfirmDialog .confirm-cancel")?.click();
        win.NarrativeCanvasApp.destroy?.();
        frame.remove();
      }

      async function runSampleLanguageChecks() {
        const cases = [
          { language: "en", label: "plugin en", title: "Your First Narrative Canvas", fileName: "Narrative Canvas Guide Sample.ncanvas" },
          { language: "zh", label: "plugin zh", title: "你的第一个 Narrative Canvas", fileName: "叙事画布功能指南示例.ncanvas" }
        ];
        for (const item of cases) {
          const target = await loadPluginFrame({ language: item.language });
          const { win, frame } = target;
          const created = await win.NarrativeCanvasApp.createSampleProjectFile();
          await waitFor(`${item.label}: sample project is created`, () => win.__createdProjectStates.length === 1);
          const sampleState = win.__createdProjectStates[0]?.project || {};
          assert(`${item.label}: sample creation returns true`, created === true);
          assert(`${item.label}: sample filename follows language`, win.__createdProjectOptions[0]?.filenameOverride === item.fileName);
          assert(`${item.label}: sample title follows language`, sampleState.title === item.title);
          assert(`${item.label}: sample language marker follows language`, sampleState.variables?.sample_language === item.language);
          assert(`${item.label}: sample version marker is current`, sampleState.variables?.sample_version === 2);
          const branchTargets = (sampleState.links || []).filter((link) => ["n4", "n12"].includes(link.from)).reduce((groups, link) => {
            (groups[link.from] ||= []).push(link.to);
            return groups;
          }, {});
          assert(`${item.label}: onboarding choices have distinct feedback targets`, Object.values(branchTargets).every((targets) => targets.length === new Set(targets).size));
          if (item.language === "zh") {
            const sampleText = JSON.stringify(sampleState);
            const guideNode = sampleState.nodes?.find((node) => node.id === "n3");
            const choiceNode = sampleState.nodes?.find((node) => node.id === "n4");
            assert(`${item.label}: sample uses 演示设置 terminology`, guideNode?.title === "演示设置是什么" && !sampleText.includes("Playbook") && !sampleText.includes("Play 预览"));
            assert(`${item.label}: sample describes all four Document formats`, sampleState.notes?.includes("纯文本 / Ink / Yarn / Twee"));
            assert(`${item.label}: sample choice labels rely on generated card numbering`, choiceNode?.choiceOptions?.every((option) => !/^[①②③④⑤⑥⑦⑧⑨⑩]/.test(option.label || "")));
          }
          win.NarrativeCanvasApp.destroy?.();
          frame.remove();
        }
      }

      async function run() {
        try {
          const web = await loadWebFrame();
          await runCoreChecks("web", web);

          const plugin = await loadPluginFrame();
          await runCoreChecks("plugin", plugin);
          await runCustomTemplateChecks();
          await runSampleLanguageChecks();
          await runLanguageChecks();
          await runWebLanguageChecks();
        } catch (error) {
          fail("smoke runner crashed", error && error.stack ? error.stack : String(error));
        } finally {
          report.finishedAt = new Date().toISOString();
          report.status = report.failures.length ? "fail" : "pass";
          document.body.setAttribute("data-smoke-status", report.status);
          document.querySelector("#smoke-report").textContent = JSON.stringify(report, null, 2);
        }
      }

      window.addEventListener("load", run, { once: true });
    </script>
  </body>
</html>
