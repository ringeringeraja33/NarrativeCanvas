<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Narrative Canvas Shadow Mount Smoke</title>
</head>
  <body data-shadow-smoke-status="running">
    <div id="shadow-host" class="narrative-canvas-plugin-host" style="position:fixed;inset:0;"></div>
    <pre id="shadow-smoke-report"></pre>
    <script>
      (async () => {
        const report = [];
        const record = (line) => report.push(line);
        const assert = (name, ok, detail = "") => {
          record(`${ok ? "[ok]" : "[fail]"} ${name}${detail ? ` :: ${detail}` : ""}`);
          if (!ok) throw new Error(name);
        };
        const waitFor = async (name, check, timeout = 8000) => {
          const start = Date.now();
          while (Date.now() - start < timeout) {
            try { if (check()) { record(`[ok] ${name}`); return; } } catch (_e) { /* retry */ }
            await new Promise((resolve) => setTimeout(resolve, 40));
          }
          throw new Error(name);
        };
        try {
          const [appJs, indexHtml, canvasCss] = await Promise.all([
            fetch("../app.js").then((res) => res.text()),
            fetch("../index.html").then((res) => res.text()),
            fetch("../canvas.css").then((res) => res.text())
          ]);
          // Mirror the plugin view mount: shadow root + :root→:host converted style + body html.
          const host = document.getElementById("shadow-host");
          const shadow = host.attachShadow({ mode: "open" });
          const style = document.createElement("style");
          style.textContent = canvasCss
            .replace(/:root(\[[^\]]+\])/g, ":host($1)")
            .replace(/:root\b/g, ":host");
          const bodyHtml = indexHtml.match(/<body>([\s\S]*)<\/body>/)[1].replace(/<script[\s\S]*?<\/script>/g, "");
          const parsed = new DOMParser().parseFromString(`<!doctype html><html><body>${bodyHtml}</body></html>`, "text/html");
          const fragment = document.createDocumentFragment();
          fragment.append(style);
          parsed.body.childNodes.forEach((node) => fragment.append(document.importNode(node, true)));
          shadow.replaceChildren(fragment);

          let savedJson = null;
          window.NarrativeCanvasHost = {
            pluginId: "narrative-canvas",
            root: shadow,
            stateFile: "shadow.ncanvas",
            loadProject: async () => savedJson,
            saveProject: async (json) => { savedJson = json; return "shadow.ncanvas"; },
            readVaultFile: async () => "# Preview",
            searchVaultFiles: async () => ["Notes/alpha.md"],
            openVaultFile: async (path) => path,
            getLanguage: () => "en"
          };
          const script = document.createElement("script");
          script.textContent = appJs;
          document.body.append(script);
          assert("shadow: app installs", Boolean(window.NarrativeCanvasApp?.init));
          assert("shadow: app initializes", await window.NarrativeCanvasApp.init() !== false);
          const doc = shadow;
          assert("shadow: scope is the shadow root", Boolean(doc.querySelector(".app-shell")));
          assert("shadow: styles apply inside the shadow tree", getComputedStyle(doc.querySelector(".app-shell")).display !== "inline");
          assert("shadow: document has no leaked app shell", !document.querySelector(".app-shell"));
          await waitFor("shadow: sample nodes render", () => doc.querySelectorAll(".node[data-node-id]").length > 0);
          const click = (el) => el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, composed: true }));
          click(doc.querySelector(".node[data-node-id]"));
          await waitFor("shadow: clicking a node selects it inside the shadow tree", () => Boolean(doc.querySelector(".node.selected[data-node-id]")) || Boolean(shadow.querySelector("#nodePanel input, #nodePanel textarea")));
          click(doc.querySelector("[data-file-id='characters']"));
          await waitFor("shadow: library page opens", () => doc.querySelector(".app-shell")?.dataset.activeFile === "characters");
          const search = doc.querySelector("[data-character-search]");
          if (search) {
            search.focus();
            assert("shadow: focus lands inside the shadow tree", shadow.activeElement === search, String(shadow.activeElement?.tagName));
          }
          window.NarrativeCanvasApp.destroy();
          document.body.dataset.shadowSmokeStatus = "pass";
        } catch (error) {
          record(`[fail] ${error?.message || error}`);
          document.body.dataset.shadowSmokeStatus = "fail";
        } finally {
          document.getElementById("shadow-smoke-report").textContent = report.join("\n");
        }
      })();
    </script>
  </body>
</html>
