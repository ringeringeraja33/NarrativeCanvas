<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Narrative Canvas Fixture Roundtrip</title>
    <style>
      body {
        margin: 0;
        background: #101418;
        color: #e6edf3;
        font-family: system-ui, sans-serif;
      }

      iframe {
        width: 1280px;
        height: 900px;
        border: 0;
      }

      #fixture-report {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body data-fixture-status="running">
    <pre id="fixture-report">Running fixture roundtrip...</pre>
    <script>
      const fixtures = [
        {
          name: "legacy-no-ui-sidebar",
          file: "fixtures/legacy-no-ui-sidebar.ncanvas",
          checks(doc, saved, downloads) {
            assert("legacy: sidebar defaults saved", saved.ui.sidebar && saved.ui.sidebar.leftWidth > 0 && saved.ui.sidebar.rightWidth > 0);
            assert("legacy: project nodes preserved", saved.project.nodes.length === 2);
            assert("legacy: current file card rendered", Boolean(doc.querySelector("#projectFileName")));
            assert("legacy: project export downloaded", downloads.some((item) => item.filename === "legacy-no-ui-sidebar.json"));
          },
          exports: ["export-json"]
        },
        {
          name: "legacy-events-columns",
          file: "fixtures/legacy-events-columns.ncanvas",
          checks(doc, saved, downloads) {
            const eventSheet = saved.project.eventSheet;
            assert("events: hidden columns migrated", eventSheet.hiddenColumns.includes("notes"));
            assert("events: event row visible", doc.body.textContent.includes("Boarding"));
            assert("events: filter state visible", doc.querySelector("[data-event-filter-bar]")?.textContent.includes("boarding"));
            assert("events: csv export downloaded", downloads.some((item) => item.filename.endsWith("-events.csv")));
            assert("events: json export downloaded", downloads.some((item) => item.filename.endsWith("-events.json")));
          },
          exports: ["export-event-sheet", "export-event-sheet-json"]
        },
        {
          name: "custom-node-types",
          file: "fixtures/custom-node-types.ncanvas",
          async checks(doc, saved, downloads) {
            const clueType = saved.project.nodeTypes.find((type) => type.type === "Clue");
            const clueNode = saved.project.nodes.find((node) => node.type === "Clue");
            assert("custom: legacy customNodeTypes migrated", Boolean(clueType));
            assert("custom: custom fields preserved", clueNode?.customFields?.evidence === "Moonlit edge");
            assert("custom: full json export downloaded", downloads.some((item) => item.filename === "custom-node-types.json"));
            const runtimeJson = JSON.parse(await readDownloadText(downloads, "custom-node-types-runtime.json"));
            assert("custom: runtime report flags custom node type", runtimeJson.report?.warnings?.some((warning) => warning.code === "custom-node-type-runtime-only" && warning.nodeId === "n1"));
          },
          exports: ["export-json", "export-runtime-json"]
        },
        {
          name: "characters-cast-chips",
          file: "fixtures/characters-cast-chips.ncanvas",
          async checks(doc, saved, downloads) {
            const dialog = saved.project.nodes.find((node) => node.id === "n1");
            assert("codex: ordered references preserved", JSON.stringify(dialog?.cast?.map((entry) => `${entry.characterId}:${entry.role}`)) === JSON.stringify([
              "c0:Speaker",
              "c1:Present",
              "loc0:Setting",
              "item0:Used",
              "lore0:Revealed"
            ]));
            assert("codex: all categories preserved", ["Character", "Location", "Item", "Lore"].every((kind) => saved.project.characters.some((entry) => entry.kind === kind)));
            assert("characters: search restored", doc.querySelector("[data-character-search]")?.value === "Mara");
            assert("characters: backlink rendered", doc.body.textContent.includes("Dialog"));
            assert("codex: md export downloaded", downloads.some((item) => item.filename === "Narrative-Library.md"));
            assert("codex: json export downloaded", downloads.some((item) => item.filename === "Narrative-Library.json"));
            clickElement(doc.querySelector('[data-file-id="adventure"]'));
            await waitFor("codex: canvas opened for runtime export", () => doc.querySelector(".app-shell")?.dataset.activeFile === "adventure");
            clickElement(doc.querySelector('.node[data-node-id="n1"]'));
            await waitFor("codex: node inspector opened", () => Boolean(doc.querySelector('.cast-editor [data-node-section="cast"]')));
            const castToggle = doc.querySelector('.cast-editor [data-node-section="cast"]');
            if (castToggle?.getAttribute("aria-expanded") !== "true") clickElement(castToggle);
            await waitFor("codex: reference editor expanded", () => doc.querySelectorAll("[data-node-cast-row-index]").length === 5);
            const libraryReferenceText = doc.querySelector(".cast-editor")?.textContent || "";
            assert("codex: reference editor replaces the old character-only field", libraryReferenceText.includes("Library references") || libraryReferenceText.includes("资料"), libraryReferenceText);
            const newEntryInput = doc.querySelector("[data-cast-entry-context='new']");
            newEntryInput?.focus();
            await waitFor("codex: every category is selectable in the reference editor", () => doc.querySelectorAll(".cast-add-row .cast-entry-suggestion-group").length === 4);
            newEntryInput?.blur();
            const lastDragHandle = doc.querySelector('[data-node-cast-drag="4"]');
            lastDragHandle?.dispatchEvent(new doc.defaultView.KeyboardEvent("keydown", { key: "ArrowUp", bubbles: true, cancelable: true }));
            await waitFor("codex: keyboard reorder applied", () => doc.querySelector('[data-node-cast-row-index="3"] [data-cast-entry-input]')?.dataset.castEntryId === "lore0");
            await doc.defaultView.NarrativeCanvasApp.save();
            const reorderedState = JSON.parse(await doc.defaultView.NarrativeCanvasHost.loadProject());
            const reordered = reorderedState.project.nodes.find((node) => node.id === "n1")?.cast?.map((entry) => entry.characterId);
            assert("codex: reordered references persist", JSON.stringify(reordered) === JSON.stringify(["c0", "c1", "loc0", "lore0", "item0"]));
            const bodyField = doc.querySelector('textarea[data-node-field="body"]');
            bodyField.value = `${bodyField.value}\n@Old`;
            bodyField.setSelectionRange(bodyField.value.length, bodyField.value.length);
            bodyField.dispatchEvent(new doc.defaultView.InputEvent("input", { bubbles: true, inputType: "insertText", data: "d" }));
            await waitFor("codex: location appears in @ suggestions", () => Boolean(doc.querySelector('.mention-option-kind[data-codex-kind="Location"]')));
            const locationKindText = doc.querySelector('.mention-option-kind[data-codex-kind="Location"]')?.textContent.trim();
            assert("codex: @ suggestion identifies its category", locationKindText === "Location" || locationKindText === "地点", locationKindText);
            clickElement(doc.querySelector('.mention-option-kind[data-codex-kind="Location"]')?.closest("[data-mention-index]"));
            await waitFor("codex: @ selection creates an explicit reference", () => [...doc.querySelectorAll('[data-cast-entry-input]')].filter((control) => control.dataset.castEntryId === "loc0").length === 2);
            clickElement(doc.querySelector('[data-action="export-runtime-json"]'));
            await waitFor("codex: runtime export downloaded", () => downloads.some((item) => item.filename === "characters-cast-chips-runtime.json"));
            const runtime = JSON.parse(await readDownloadText(downloads, "characters-cast-chips-runtime.json"));
            const runtimeDialog = runtime.nodes.find((node) => node.id === "n1");
            assert("codex: runtime export includes stable ids and kinds", runtimeDialog?.cast?.some((entry) => entry.codexId === "loc0" && entry.characterId === "loc0" && entry.kind === "Location" && entry.role === "Setting"));
            assert("codex: runtime export separates character compatibility data from the full Codex", runtime.characters.length === 2 && runtime.codex.length === 5 && runtime.codex.some((entry) => entry.id === "item0" && entry.kind === "Item"));
          },
          exports: ["export-characters-md", "export-characters-json"]
        },
        {
          name: "choice-link-branches",
          file: "fixtures/choice-link-branches.ncanvas",
          checks(doc, saved, downloads) {
            const links = saved.project.links.filter((link) => link.from === "n0").sort((a, b) => a.choiceIndex - b.choiceIndex);
            assert("choice links: branch count preserved", links.length === 3);
            assert("choice links: first branch labeled", links[0]?.choiceIndex === 0 && links[0]?.label === "Offer the watch");
            assert("choice links: second branch labeled", links[1]?.choiceIndex === 1 && links[1]?.label === "Hide the watch");
            assert("choice links: third branch labeled", links[2]?.choiceIndex === 2 && links[2]?.label === "Ask about Old Reyes");
            const renderedLabels = [...doc.querySelectorAll("#linkLayer text")].map((node) => node.textContent);
            assert("choice links: labels render on canvas", ["Offer the watch", "Hide the watch", "Ask about Old Reyes"].every((label) => renderedLabels.includes(label)));
          },
          exports: []
        },
        {
          name: "state-runtime-key-play",
          file: "fixtures/state-runtime-key-play.ncanvas",
          async checks(doc, saved, downloads, assets) {
            assert("state key: flat variables saved", saved.project.variables["inventory_coins"] === 3 && saved.project.variables["flag_watch_missing"] === true);
            const storyMd = await readDownloadText(downloads, "state-runtime-key-play-story.md");
            assert("state key: story markdown exports readable route", storyMd.includes("# State Runtime Key Play") && storyMd.includes("<!-- narrative-canvas-story-md: v1 -->") && storyMd.includes("Nested coins: {nested_inventory_coins}.") && storyMd.includes("flag_tokens.includes(\"boarding\")") && storyMd.includes("goto: Bribe_accepted"));
            const storyLayout = JSON.parse(await readDownloadText(downloads, "state-runtime-key-play-layout.json"));
            const storyLayoutErrors = validateJsonSchemaSubset(storyLayout, assets.storyLayoutSchema);
            assert("state key: story layout sidecar matches schema", storyLayoutErrors.length === 0, storyLayoutErrors.slice(0, 5).join("; "));
            assert("state key: story layout sidecar exports node positions", storyLayout.format === "narrative-canvas-story-layout" && storyLayout.nodes.some((node) => node.id === "n1" && node.title === "Bribe check" && Number.isFinite(node.x)) && storyLayout.links.some((link) => link.choiceOptionId === "opt_bribe"));
            assert("state key: story layout sidecar exports port positions", storyLayout.nodes.some((node) => node.id === "n1" && node.portPositions?.input?.side === "left" && node.portPositions?.output?.side === "right"));
            const stateSchema = JSON.parse(await readDownloadText(downloads, "state-runtime-key-play-state.schema.json"));
            const stateSchemaErrors = validateJsonSchemaSubset(stateSchema, assets.stateSchemaSchema);
            assert("state key: state schema matches schema", stateSchemaErrors.length === 0, stateSchemaErrors.slice(0, 5).join("; "));
            const coinSchema = stateSchema.variables?.find((variable) => variable.key === "inventory_coins");
            const nestedCoinSchema = stateSchema.variables?.find((variable) => variable.key === "nested_inventory.coins");
            assert("state key: state schema sidecar has format marker", stateSchema.format === "narrative-canvas-state-schema" && stateSchema.version === 1 && stateSchema.summary?.variableCount >= 1);
            assert("state key: state schema tracks coin refs", coinSchema?.type === "number" && coinSchema.initialValue === 3 && coinSchema.readBy.length > 0 && coinSchema.writtenBy.length > 0 && coinSchema.interpolatedBy.length > 0);
            assert("state key: state schema keeps nested path fallback", nestedCoinSchema?.type === "number" && nestedCoinSchema.exportKey === "nested_inventory_coins" && nestedCoinSchema.initialValue === 3 && nestedCoinSchema.statuses.includes("export-blocked"));
            const transientVisitKeys = stateSchema.variables?.filter((variable) => String(variable.key).startsWith("visited.")) || [];
            assert("state key: state schema omits transient visit tracking keys", transientVisitKeys.length === 0, JSON.stringify(transientVisitKeys));
            const exportProfile = JSON.parse(await readDownloadText(downloads, "state-runtime-key-play-export.profile.json"));
            const exportProfileErrors = validateJsonSchemaSubset(exportProfile, assets.exportProfileSchema);
            assert("state key: export profile matches schema", exportProfileErrors.length === 0, exportProfileErrors.slice(0, 5).join("; "));
            assert("state key: export profile lists portable targets", exportProfile.files.some((file) => file.id === "story-md" && file.name === "state-runtime-key-play-story.md") && exportProfile.files.some((file) => file.id === "runtime-json" && file.schema === "docs/runtime-json.schema.json") && exportProfile.targets.some((target) => target.id === "ink"));
            assert("state key: export profile keeps mappings and warnings", exportProfile.mappings.variables["nested_inventory.coins"] === "nested_inventory_coins" && !("visited.start" in exportProfile.mappings.variables) && exportProfile.mappings.nodes.n1 === "Bribe_check" && exportProfile.warnings.some((warning) => warning.code === "state-key-name-sanitized"));
            const runtimeJson = JSON.parse(await readDownloadText(downloads, "state-runtime-key-play-runtime.json"));
            assert("state key: project defaults to canvas workflow", saved.project.workflowMode === "canvas");
            assert("state key: runtime json exported variables", runtimeJson.variables.inventory_coins === 3 && runtimeJson.variables.flag_watch_missing === true && runtimeJson.variables.ticket_phrase === "red && blue" && Array.isArray(runtimeJson.variables.flag_tokens) && runtimeJson.variables.flag_tokens.includes("boarding") && runtimeJson.variables.nested_inventory_coins === 3);
            assert("state key: runtime json keeps export report", Boolean(runtimeJson.report?.variableNameMap?.inventory_coins));
            assert("state key: runtime json omits transient visit tracking effect", !runtimeJson.nodes.find((node) => node.id === "n0")?.effects?.some((effect) => String(effect.sourceKey || effect.key || "").startsWith("visited.")));
            const bribeChoiceRuntime = runtimeJson.nodes.find((node) => node.id === "n1")?.choices?.find((choice) => choice.id === "opt_bribe");
            assert("state key: runtime json omits transient visit condition", bribeChoiceRuntime?.condition && !bribeChoiceRuntime.condition.includes("visited_start"));
            const keepChoiceRuntime = runtimeJson.nodes.find((node) => node.id === "n1")?.choices?.find((choice) => choice.id === "opt_keep");
            assert("state key: runtime json bakes playbook choice lock", keepChoiceRuntime?.condition.includes("!(guard_suspicion >= 1)"));
            const conditionalRuntimeEffect = runtimeJson.nodes.find((node) => node.id === "n0")?.effects?.find((effect) => effect.op === "ifElse");
            assert("state key: runtime json exports conditional assignment", conditionalRuntimeEffect?.condition === "variable1 > variable2" && conditionalRuntimeEffect?.thenEffect?.key === "variable3" && conditionalRuntimeEffect?.thenEffect?.valueMode === "variable" && conditionalRuntimeEffect?.thenEffect?.valueSource === "variable1");
            const runtimeTimer = runtimeJson.nodes.find((node) => node.id === "n1")?.timer;
            assert("state key: runtime json exports timed choice fallback", runtimeTimer?.seconds === 3600 && runtimeTimer?.fallbackLinkId === "l1" && runtimeTimer?.targetId === "n2");
            const schemaErrors = validateJsonSchemaSubset(runtimeJson, assets.runtimeSchema);
            assert("state key: runtime json matches schema", schemaErrors.length === 0, schemaErrors.slice(0, 5).join("; "));
            assert("state key: export report dialog opens", doc.querySelector("#exportReportDialog")?.open);
            assert("state key: export report dialog has summary", Boolean(doc.querySelector("#exportReportBody .export-report-summary")));
            doc.querySelector("#exportReportDialog")?.close();
            assert("project panel omits workflow mode buttons", !doc.querySelector("[data-action='set-workflow-mode']"));
            const yarn = await readDownloadText(downloads, "state-runtime-key-play.yarn");
            assert("state key: yarn declares variable", yarn.includes("<<declare $inventory_coins = 3>>") && yarn.includes("<<declare $flag_tokens = \"[\\\"boarding\\\",\\\"watch\\\"]\">>") && yarn.includes("<<declare $nested_inventory_coins = 3>>"));
            assert("state key: yarn exports grouped condition and jump", yarn.includes("$inventory_coins >= 2") && yarn.includes("$ticket_phrase == \"red && blue\"") && yarn.includes("contains($flag_tokens, \"boarding\")") && yarn.includes("$nested_inventory_coins >= 3") && yarn.includes("not $flag_boarding_denied") && yarn.includes("<<jump Bribe_accepted>>"));
            assert("state key: yarn omits transient visit condition", !yarn.includes("visited(\"Start\")"));
            assert("state key: yarn bakes playbook choice lock", yarn.includes("-> Keep moving <<if not ($guard_suspicion >= 1)>>"));
            assert("state key: yarn exports if else variable assignment", yarn.includes("<<if $variable1 > $variable2>>") && yarn.includes("<<set $variable3 to $variable1>>") && yarn.includes("<<set $variable3 to $variable2>>") && yarn.includes("<<else>>"));
            const yarnErrors = validateYarnScript(yarn);
            assert("state key: yarn reference parser accepts export", yarnErrors.length === 0, yarnErrors.slice(0, 5).join("; "));
            const ink = await readDownloadText(downloads, "state-runtime-key-play.ink");
            assert("state key: ink declares variable", ink.includes("VAR inventory_coins = 3") && ink.includes("VAR nested_inventory_coins = 3") && ink.includes("LIST flag_tokens_items = flag_tokens_boarding, flag_tokens_watch") && ink.includes("VAR flag_tokens = (flag_tokens_boarding, flag_tokens_watch)"));
            assert("state key: ink exports grouped sticky choice", ink.includes("inventory_coins >= 2") && ink.includes("ticket_phrase == \"red && blue\"") && ink.includes("(flag_tokens ? flag_tokens_boarding)") && ink.includes("nested_inventory_coins >= 3") && ink.includes("not flag_boarding_denied") && ink.includes("[Slip two coins to the Brakeman]"));
            assert("state key: ink omits transient visit condition", !ink.includes("(Start > 0)"));
            assert("state key: ink bakes playbook choice lock", ink.includes("{not (guard_suspicion >= 1)} [Keep moving]"));
            assert("state key: ink exports if else variable assignment", ink.includes("{ variable1 > variable2:") && ink.includes("~ variable3 = variable1") && ink.includes("~ variable3 = variable2") && ink.includes("- else:"));
            const inkErrors = validateInkScript(ink);
            assert("state key: ink reference parser accepts export", inkErrors.length === 0, inkErrors.slice(0, 5).join("; "));
            const twee = await readDownloadText(downloads, "state-runtime-key-play.twee");
            assert("state key: twee has story data", twee.includes(":: StoryData") && twee.includes("\"format\": \"SugarCube\"") && twee.includes("\"format-version\": \"2.30.0\""));
            assert("state key: twee initializes variable", twee.includes("<<set $inventory_coins = 3>>") && twee.includes("<<set $flag_tokens = [\"boarding\",\"watch\"]>>") && twee.includes("<<set $nested_inventory_coins = 3>>"));
            assert("state key: twee exports plain connections as standard links", twee.includes("[[Continue->Bribe_check]]"));
            assert("state key: twee exports gated link and effects", twee.includes("$inventory_coins >= 2") && twee.includes("$ticket_phrase == \"red && blue\"") && twee.includes("$flag_tokens.includes(\"boarding\")") && twee.includes("$nested_inventory_coins >= 3") && twee.includes("!$flag_boarding_denied") && twee.includes("<<link \"Slip two coins to the Brakeman\" \"Bribe_accepted\">>") && twee.includes("<<set $inventory_coins -= 2>>"));
            assert("state key: twee omits transient visit condition", !twee.includes("visited(\"Start\") > 0"));
            assert("state key: twee bakes playbook choice lock", twee.includes("<<if !($guard_suspicion >= 1)>>"));
            assert("state key: twee exports if else variable assignment", twee.includes("<<if $variable1 > $variable2>>") && twee.includes("<<set $variable3 = $variable1>>") && twee.includes("<<set $variable3 = $variable2>>") && twee.includes("<<else>>"));
            const tweeErrors = validateTweeScript(twee);
            assert("state key: twee reference parser accepts export", tweeErrors.length === 0, tweeErrors.slice(0, 5).join("; "));
            const exportAllStart = assets.appJs.indexOf("async function exportAll()");
            const exportAllEnd = assets.appJs.indexOf("\nfunction showExportReport", exportAllStart);
            const exportAllSource = exportAllStart >= 0 && exportAllEnd > exportAllStart
              ? assets.appJs.slice(exportAllStart, exportAllEnd)
              : "";
            const expectedExportAllFragments = [
              "-story.md", "-layout.json", "-state.schema.json", "-export.profile.json", "-runtime.json",
              ".yarn", ".ink", ".twee", "-events.json", "Events Sheet.csv", "Node Fields.csv",
              "Narrative-Library.md", "Narrative-Library.json", "PLAYBOOK_FILE_NAME", "svgToPngBlob", "createZipBlob(files)", "-export.zip"
            ];
            assert("state key: export-all function exists", Boolean(exportAllSource));
            assert("state key: export-all includes every structured export", expectedExportAllFragments.every((fragment) => exportAllSource.includes(fragment)));
            assert("state key: export-all includes image export", exportAllSource.includes(".png") && exportAllSource.includes(".svg"));
            doc.defaultView.NarrativeCanvasApp.setLanguage("en", { persist: false, force: true });
            await waitFor("state key: English UI applies", () => doc.defaultView.NarrativeCanvasApp.getLanguage?.() === "en");
            clickElement(doc.querySelector("[data-file-id='variables']"));
            await waitFor("state key: playbook opens", () => doc.querySelector("#variablesPanel")?.classList.contains("active"));
            clickElement(doc.querySelector("[data-playbook-tab='variables']"));
            await waitFor("state key: variable groups render", () => doc.querySelectorAll(".variable-group-heading").length > 0);
            const variableGroups = [...doc.querySelectorAll(".variable-group-heading")].map((node) => node.dataset.variableGroup);
            assert("state key: variables group by key prefix", variableGroups.includes("inventory") && variableGroups.includes("flag") && variableGroups.includes("guard"));
            assert("state key: inventory group contains flat key", Boolean(doc.querySelector("[data-variable-group='inventory']")?.nextElementSibling?.querySelector("[data-variable-key='inventory_coins']")));
            assert("state key: variable rows include JSON buttons", Boolean(doc.querySelector("[data-variable-key='inventory_coins']")?.closest(".variable-row")?.querySelector("[data-action='focus-playbook-json']")));
            clickElement(doc.querySelector("[data-variable-key='inventory_coins']")?.closest(".variable-row")?.querySelector("[data-action='focus-playbook-json']"));
            await waitFor("state key: variable JSON button opens Advanced JSON", () => Boolean(doc.querySelector("textarea[data-project-field='variables']")?.value.includes("\"inventory_coins\"")));
            await waitFor("state key: variable JSON button focuses matching line", () => {
              const textarea = doc.querySelector("textarea[data-project-field='variables']");
              return Boolean(textarea?.value.slice(textarea.selectionStart, textarea.selectionEnd).includes("\"inventory_coins\""));
            });
            const playbookJsonTextarea = doc.querySelector("textarea[data-project-field='variables']");
            const selectedJsonLine = playbookJsonTextarea?.value.slice(playbookJsonTextarea.selectionStart, playbookJsonTextarea.selectionEnd) || "";
            assert("state key: variable JSON button focuses matching line", selectedJsonLine.includes("\"inventory_coins\""), selectedJsonLine);
            const playbookTabOrder = [...doc.querySelectorAll(".playbook-tab")].map((tab) => tab.textContent.trim()).join("|");
            assert("state key: playbook tab order places variable actions before script builder", playbookTabOrder === "Variable Definitions|Variable Actions|Script Builder|Choice Conditions|Play Rules|Validation", playbookTabOrder);
            assert("state key: script builder tab is named", doc.querySelector("[data-playbook-tab='script']")?.textContent.includes("Script Builder"));
            clickElement(doc.querySelector("[data-playbook-tab='script']"));
            await waitFor("state key: script builder rows include JSON buttons", () => Boolean(doc.querySelector(".script-node-row:not(.script-node-heading) [data-action='focus-playbook-json']")));
            assert("state key: variable actions tab is named", doc.querySelector("[data-playbook-tab='actions']")?.textContent.includes("Variable Actions"));
            clickElement(doc.querySelector("[data-playbook-tab='actions']"));
            await waitFor("state key: variable actions tab opens", () => Boolean(doc.querySelector(".playbook-actions-section")));
            const initialActionCount = saved.project.script.actions.length;
            await waitFor("state key: playbook actions render", () => doc.querySelectorAll(".playbook-action-row:not(.playbook-action-heading)").length === initialActionCount);
            assert("state key: variable actions tab contains variable actions", doc.querySelector(".playbook-actions-section")?.textContent.includes("Variable Actions"));
            assert("state key: variable actions table has editor columns", doc.querySelectorAll(".playbook-action-heading span").length === 7);
            const actionHeadings = [...doc.querySelectorAll(".playbook-action-heading span")].map((node) => node.textContent.trim());
            assert("state key: action columns put operation before value", actionHeadings.join("|") === "Trigger|Target|Key|Operation|Value|JSON|", actionHeadings.join("|"));
            const actionRows = [...doc.querySelectorAll(".playbook-action-row:not(.playbook-action-heading)")];
            assert("state key: variable actions section renders existing actions", actionRows.length === initialActionCount);
            assert("state key: variable action rows include JSON buttons", actionRows.every((row) => row.querySelector("[data-action='focus-playbook-json']")));
            assert("state key: variable actions section has no duplicate append toggle", !doc.querySelector("[data-playbook-action-field='append']"));
            const firstActionText = actionRows[0]?.textContent || "";
            assert("state key: variable actions section renders legacy gate action", firstActionText.includes("Legacy gate trigger") && firstActionText.includes("Choice Conditions") && firstActionText.includes("Legacy runtime-only action") && firstActionText.includes("lockChoice"), firstActionText);
            assert("state key: variable actions section omits variable type filters", !doc.querySelector(".playbook-actions-section .playbook-category-chip"));
            const triggerOptionValues = [...doc.querySelectorAll("[data-playbook-action-field='trigger'] option")].map((option) => option.value);
            assert("state key: variable action trigger menu omits onChoose", !triggerOptionValues.includes("onChoose"), triggerOptionValues.join("|"));
            clickElement(doc.querySelector("[data-action='show-playbook-action-draft']"));
            await waitFor("state key: action draft opens", () => Boolean(doc.querySelector(".playbook-action-draft-row")));
            let draftKey = doc.querySelector(".playbook-action-draft-row [data-draft-field='key']");
            draftKey.value = "inventory_coins";
            draftKey.dispatchEvent(new doc.defaultView.Event("change", { bubbles: true }));
            await waitFor("state key: number variable action draft uses number input", () => doc.querySelector(".playbook-action-draft-row [data-draft-field='value']")?.type === "number");
            draftKey = doc.querySelector(".playbook-action-draft-row [data-draft-field='key']");
            draftKey.value = "traveler";
            draftKey.dispatchEvent(new doc.defaultView.Event("change", { bubbles: true }));
            await waitFor("state key: string variable action draft uses text input", () => doc.querySelector(".playbook-action-draft-row [data-draft-field='value']")?.type === "text");
            const draftValue = doc.querySelector(".playbook-action-draft-row [data-draft-field='value']");

      const report = {
        status: "running",
        tests: [],
        failures: []
      };

      function record(name, status, detail = "") {
        report.tests.push({ name, status, detail });
        if (status === "fail") report.failures.push(`${name}${detail ? `: ${detail}` : ""}`);
        renderReport();
      }

      function assert(name, condition, detail = "") {
        if (!condition) throw new Error(`${name}${detail ? `: ${detail}` : ""}`);
        record(name, "pass");
      }

      function clickElement(element) {
        assert("click target exists", Boolean(element));
        element.dispatchEvent(new element.ownerDocument.defaultView.MouseEvent("click", {
          bubbles: true,
          cancelable: true,
          view: element.ownerDocument.defaultView
        }));
      }

      function renderReport() {
        const node = document.querySelector("#fixture-report");
        node.textContent = JSON.stringify(report, null, 2);
      }

      async function waitFor(name, predicate, timeout = 5000) {
        const started = performance.now();
        while (performance.now() - started < timeout) {
          if (predicate()) return true;
          await new Promise((resolve) => setTimeout(resolve, 40));
        }
        throw new Error(`${name} timed out`);
      }

      const assetVersion = new URL(window.location.href).searchParams.get("run") || String(Date.now());

      function assetUrl(path) {
        const url = new URL(`../${path}`, window.location.href);
        url.searchParams.set("run", assetVersion);
        return url.href;
      }

      async function readDownloadText(downloads, filename) {
        const item = downloads.find((entry) => entry.filename === filename);
        assert(`download exists: ${filename}`, Boolean(item));
        return item.blob.text();
      }

      async function getDownloadBlob(downloads, pattern) {
        const item = downloads.find((entry) => pattern.test(entry.filename));
        assert(`download exists: ${pattern}`, Boolean(item));
        return item.blob;
      }

      async function listZipEntryNames(blob) {
        const bytes = new Uint8Array(await blob.arrayBuffer());
        const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        let eocdOffset = -1;
        for (let offset = bytes.length - 22; offset >= 0; offset -= 1) {
          if (view.getUint32(offset, true) === 0x06054b50) {
            eocdOffset = offset;
            break;
          }
        }
        assert("zip: end of central directory found", eocdOffset >= 0);
        const entryCount = view.getUint16(eocdOffset + 10, true);
        let offset = view.getUint32(eocdOffset + 16, true);
        const decoder = new TextDecoder();
        const names = [];
        for (let index = 0; index < entryCount; index += 1) {
          assert("zip: central directory header found", view.getUint32(offset, true) === 0x02014b50);
          const nameLength = view.getUint16(offset + 28, true);
          const extraLength = view.getUint16(offset + 30, true);
          const commentLength = view.getUint16(offset + 32, true);
          names.push(decoder.decode(bytes.slice(offset + 46, offset + 46 + nameLength)));
          offset += 46 + nameLength + extraLength + commentLength;
        }
        return names;
      }

      async function countDistinctOpaquePixels(blob) {
        const image = new Image();
        const url = URL.createObjectURL(blob);
        try {
          await new Promise((resolve, reject) => {
            image.onload = resolve;
            image.onerror = reject;
            image.src = url;
          });
          const canvas = document.createElement("canvas");
          canvas.width = image.naturalWidth;
          canvas.height = image.naturalHeight;
          const context = canvas.getContext("2d");
          context.drawImage(image, 0, 0);
          const data = context.getImageData(0, 0, canvas.width, canvas.height).data;
          const colors = new Set();
          const step = Math.max(4, Math.floor(data.length / 4 / 12000) * 4);
          for (let index = 0; index < data.length; index += step) {
            if (data[index + 3] < 200) continue;
            colors.add(`${data[index]},${data[index + 1]},${data[index + 2]}`);
            if (colors.size > 12) break;
          }
          return colors.size;
        } finally {
          URL.revokeObjectURL(url);
        }
      }

        return { html, css, appJs, runtimeSchema, stateSchemaSchema, storyLayoutSchema, exportProfileSchema };
      }

      function validateJsonSchemaSubset(value, schema, path = "$", root = schema) {
        if (schema === true || !schema) return [];
        if (schema.$ref) {
          const target = resolveLocalSchemaRef(schema.$ref, root);
          return target ? validateJsonSchemaSubset(value, target, path, root) : [`${path}: unresolved schema ref ${schema.$ref}`];
        }
        const errors = [];
        if (Object.prototype.hasOwnProperty.call(schema, "const") && value !== schema.const) {
          errors.push(`${path}: expected const ${JSON.stringify(schema.const)}`);
        }
        if (Array.isArray(schema.enum) && !schema.enum.includes(value)) {
          errors.push(`${path}: expected one of ${schema.enum.map((item) => JSON.stringify(item)).join(", ")}`);
        }
        if (schema.type && !schemaTypeMatches(value, schema.type)) {
          errors.push(`${path}: expected type ${Array.isArray(schema.type) ? schema.type.join("|") : schema.type}`);
          return errors;
        }
        if (schema.format === "date-time" && typeof value === "string" && Number.isNaN(Date.parse(value))) {
          errors.push(`${path}: expected date-time string`);
        }
        if (typeof schema.minimum === "number" && typeof value === "number" && value < schema.minimum) {
          errors.push(`${path}: expected minimum ${schema.minimum}`);
        }
        if (schema.required && isPlainObject(value)) {
          schema.required.forEach((key) => {
            if (!Object.prototype.hasOwnProperty.call(value, key)) errors.push(`${path}: missing ${key}`);
          });
        }
        if (schema.properties && isPlainObject(value)) {
          Object.entries(schema.properties).forEach(([key, childSchema]) => {
            if (Object.prototype.hasOwnProperty.call(value, key)) {
              errors.push(...validateJsonSchemaSubset(value[key], childSchema, `${path}.${key}`, root));
            }
          });
        }
        if (schema.additionalProperties === false && isPlainObject(value)) {
          const allowed = new Set(Object.keys(schema.properties || {}));
          Object.keys(value).forEach((key) => {
            if (!allowed.has(key)) errors.push(`${path}: unexpected ${key}`);
          });
        } else if (schema.additionalProperties && schema.additionalProperties !== true && isPlainObject(value)) {
          const allowed = new Set(Object.keys(schema.properties || {}));
          Object.entries(value).forEach(([key, childValue]) => {
            if (!allowed.has(key)) {
              errors.push(...validateJsonSchemaSubset(childValue, schema.additionalProperties, `${path}.${key}`, root));
            }
          });
        }
        if (schema.items && Array.isArray(value)) {
          value.forEach((item, index) => {
            errors.push(...validateJsonSchemaSubset(item, schema.items, `${path}[${index}]`, root));
          });
        }
        return errors;
      }

      function resolveLocalSchemaRef(ref, root) {
        if (!ref.startsWith("#/")) return null;
        return ref.slice(2).split("/").reduce((current, segment) => {
          const key = segment.replace(/~1/g, "/").replace(/~0/g, "~");
          return current && Object.prototype.hasOwnProperty.call(current, key) ? current[key] : null;
        }, root);
      }

      function schemaTypeMatches(value, expected) {
        const types = Array.isArray(expected) ? expected : [expected];
        return types.some((type) => {
          if (type === "null") return value === null;
          if (type === "array") return Array.isArray(value);
          if (type === "object") return isPlainObject(value);
          if (type === "integer") return Number.isInteger(value);
          return typeof value === type;
        });
      }

      function isPlainObject(value) {
        return Boolean(value && typeof value === "object" && !Array.isArray(value));
      }

      function validateYarnScript(source, options = {}) {
        const errors = [];
        const nodes = parseYarnNodes(source, errors);
        const titles = new Set(nodes.map((node) => node.title));
        if (!nodes.length) errors.push("no Yarn nodes found");
        nodes.forEach((node) => {
          if (!node.body.some((line) => line.trim() === "---")) errors.push(`${node.title}: missing body separator`);
          const commandErrors = validateYarnCommands(node);
          errors.push(...commandErrors);
          collectRegexTargets(node.text, /<<jump\s+([A-Za-z_]\w*)\s*>>/g).forEach((target) => {
            if (!titles.has(target)) errors.push(`${node.title}: missing jump target ${target}`);
          });
        });
        const declarations = collectRegexTargets(source, /<<declare\s+\$([A-Za-z_]\w*)\s*=/g);
        const requiredVariable = options.requiredVariable === undefined ? "inventory_coins" : options.requiredVariable;
        if (requiredVariable && !declarations.includes(requiredVariable)) errors.push(`missing ${requiredVariable} declaration`);
        return errors;
      }

      function parseYarnNodes(source, errors) {
        const lines = String(source || "").replace(/\r\n/g, "\n").split("\n");
        const nodes = [];
        let current = null;
        lines.forEach((line, index) => {
          const title = line.match(/^title:\s*(.+?)\s*$/);
          if (title) {
            if (current && !current.closed) errors.push(`${current.title}: missing === before line ${index + 1}`);
            current = { title: title[1].trim(), body: [], text: "", closed: false };
            nodes.push(current);
            return;
          }
          if (!current) return;
          if (line.trim() === "===") {
            current.closed = true;
            current.text = current.body.join("\n");
            current = null;
            return;
          }
          current.body.push(line);
        });
        if (current && !current.closed) errors.push(`${current.title}: missing === at end`);
        return nodes;
      }

      function validateYarnCommands(node) {
        const errors = [];
        const commands = [...node.text.matchAll(/<<([^>\n]+)>>/g)].map((match) => match[1].trim());
        commands.forEach((command) => {
          if (/^(declare|jump|set|if|else|endif)\b/.test(command)) return;
          errors.push(`${node.title}: unsupported Yarn command ${command}`);
        });
        node.body.forEach((line) => {
          const trimmed = line.trim();
          if (!trimmed.startsWith("->")) return;
          if (!/^->\s+.+?(?:\s+<<if\s+.+>>)?$/.test(trimmed)) errors.push(`${node.title}: malformed option line ${trimmed}`);
        });
        return errors;
      }

      function validateInkScript(source, options = {}) {
        const errors = [];
        const text = String(source || "").replace(/\r\n/g, "\n");
        const knots = [...text.matchAll(/^===\s+([A-Za-z_]\w*)\s+===\s*$/gm)].map((match) => match[1]);
        const knotSet = new Set(knots);
        if (!knots.length) errors.push("no ink knots found");
        const requiredVariable = options.requiredVariable === undefined ? "inventory_coins" : options.requiredVariable;
        if (requiredVariable && !new RegExp(`^VAR\\s+${requiredVariable}\\s*=`, "m").test(text)) errors.push(`missing ${requiredVariable} VAR`);
        collectRegexTargets(text, /(?:^|\n)\s*->\s+([A-Za-z_]\w*|END)\b/g).forEach((target) => {
          if (target !== "END" && !knotSet.has(target)) errors.push(`missing divert target ${target}`);
        });
        const openBraces = countOccurrences(text, "{");
        const closeBraces = countOccurrences(text, "}");
        if (openBraces !== closeBraces) errors.push(`ink brace count mismatch ${openBraces}/${closeBraces}`);
        [...text.matchAll(/^\s*\+\s+/gm)].forEach((match) => {
          const line = text.slice(match.index, text.indexOf("\n", match.index) === -1 ? text.length : text.indexOf("\n", match.index));
          if (!/\[[^\]]+\]/.test(line)) errors.push(`malformed ink choice ${line.trim()}`);
        });
        return errors;
      }

      function validateTweeScript(source) {
        const errors = [];
        const passages = parseTweePassages(source, errors);
        const byName = new Map();
        passages.forEach((passage) => {
          if (byName.has(passage.name)) errors.push(`duplicate passage ${passage.name}`);
          byName.set(passage.name, passage);
          validateSugarCubeMacroBalance(passage, errors);
        });
        ["StoryData", "StoryTitle", "StoryInit"].forEach((name) => {
          if (!byName.has(name)) errors.push(`missing ${name}`);
        });
        const storyData = byName.get("StoryData");
        if (storyData) {
          try {
            const parsed = JSON.parse(storyData.body.trim());
            if (parsed.format !== "SugarCube") errors.push("StoryData format is not SugarCube");
            if (!parsed.start) errors.push("StoryData start is missing");
            if (parsed.start && !byName.has(parsed.start)) errors.push(`start passage missing: ${parsed.start}`);
          } catch (error) {
            errors.push(`StoryData JSON invalid: ${error.message}`);
          }
        }
        passages.forEach((passage) => {
          for (const target of collectTweeTargets(passage.body)) {
            if (!byName.has(target)) errors.push(`${passage.name}: missing target ${target}`);
          }
        });
        return errors;
      }

      function parseTweePassages(source, errors) {
        const lines = String(source || "").replace(/\r\n/g, "\n").split("\n");
        const passages = [];
        let current = null;
        lines.forEach((line, index) => {
          const match = line.match(/^::\s+(.+?)(?:\s+\[[^\]]*\])?(?:\s+\{.*\})?\s*$/);
          if (match) {
            if (current) current.body = current.lines.join("\n").trim();
            current = { name: match[1].trim(), line: index + 1, lines: [], body: "" };
            passages.push(current);
            return;
          }
          if (!current) {
            if (line.trim()) errors.push(`content before first passage at line ${index + 1}`);
            return;
          }
          current.lines.push(line);
        });
        if (current) current.body = current.lines.join("\n").trim();
        if (!passages.length) errors.push("no Twee passages found");
        return passages;
      }

      function validateSugarCubeMacroBalance(passage, errors) {
        const body = passage.body || "";
        [
          ["<<if", "<</if>>"],
          ["<<link", "<</link>>"]
        ].forEach(([open, close]) => {
          const openCount = countOccurrences(body, open);
          const closeCount = countOccurrences(body, close);
          if (openCount !== closeCount) errors.push(`${passage.name}: ${open} count ${openCount} does not match ${close} count ${closeCount}`);
        });
      }

      function collectTweeTargets(body) {
        const targets = [];
        String(body || "").replace(/<<goto\s+"([^"]+)"\s*>>/g, (_match, target) => {
          targets.push(target);
          return _match;
        });
        String(body || "").replace(/<<link\s+"(?:[^"\\]|\\.)*"\s+"([^"]+)"\s*>>/g, (_match, target) => {
          targets.push(target);
          return _match;
        });
        String(body || "").replace(/\[\[(?:[\s\S]*?)(?:->|\|)([^\]]+)\]\]/g, (_match, target) => {
          targets.push(target.replace(/&#93;/gi, "]").trim());
          return _match;
        });
        return targets;
      }

      function countOccurrences(text, pattern) {
        return String(text || "").split(pattern).length - 1;
      }

      function collectRegexTargets(text, pattern) {
        const targets = [];
        String(text || "").replace(pattern, (_match, target) => {
          targets.push(target);
          return _match;
        });
        return targets;
      }

      function extractBodyHtml(html) {
        const match = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        return match ? match[1].replace(/<script[\s\S]*?<\/script>/gi, "") : html;
      }

      function scopeCss(css) {
        return css
          .replace(/:root/g, ".narrative-canvas-plugin-host")
          .replace(/(^|})\s*html\s*,\s*body\s*{/g, "$1\n.narrative-canvas-plugin-host {")
          .replace(/(^|})\s*body\s*{/g, "$1\n.narrative-canvas-plugin-host {");
      }

      async function loadFixtureFrame(fixture, assets) {
        const fixtureText = await fetch(new URL(fixture.file, window.location.href)).then((response) => response.text());
        const frame = document.createElement("iframe");
        document.body.append(frame);
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        doc.open();
        doc.write("<!doctype html><html><head><meta charset=\"utf-8\"></head><body></body></html>");
        doc.close();

        const style = doc.createElement("style");
        style.textContent = scopeCss(assets.css);
        doc.head.append(style);

        const host = doc.createElement("div");
        host.className = "narrative-canvas-plugin-host";
        host.innerHTML = extractBodyHtml(assets.html);
        doc.body.append(host);

        const downloads = [];
        const originalCreateObjectURL = win.URL.createObjectURL.bind(win.URL);
        const originalRevokeObjectURL = win.URL.revokeObjectURL.bind(win.URL);
        const originalClick = win.HTMLAnchorElement.prototype.click;
        win.URL.createObjectURL = (blob) => {
          const url = originalCreateObjectURL(blob);
          downloads.push({ blob, url, filename: "" });
          return url;
        };
        win.URL.revokeObjectURL = (url) => originalRevokeObjectURL(url);
        win.HTMLAnchorElement.prototype.click = function click() {
          const item = downloads.find((entry) => entry.url === this.href) || downloads[downloads.length - 1];
          if (item) item.filename = this.download || "";
        };

        let savedText = "";
        const hostApi = {
          pluginId: "fixture-test",
          root: host,
          loadProject: async () => savedText || fixtureText,
          saveProject: async (text) => {
            savedText = text;
            return fixture.file;
          },
          ensureProjectFile: async () => "",
          createProjectFile: async (text) => {
            savedText = text;
            return "fixtures/new-project.ncanvas";
          },
          previewNewProjectFile: async () => "fixtures/Untitled.ncanvas",
          chooseProjectFile: async () => fixture.file,
          getProjectFile: () => fixture.file
        };
        win.NarrativeCanvasHost = hostApi;

        const script = doc.createElement("script");
        script.textContent = assets.appJs;
        doc.body.append(script);
        await win.NarrativeCanvasApp.init();
        await waitFor(`${fixture.name}: ready`, () => Boolean(doc.querySelector(".app-shell[data-theme]")));
        await win.NarrativeCanvasApp.save();
        const saved = JSON.parse(savedText);
        await win.NarrativeCanvasApp.loadVaultProject();
        await win.NarrativeCanvasApp.save();

        for (const action of fixture.exports) {
          const button = doc.querySelector(`[data-action="${action}"]`);
          assert(`${fixture.name}: ${action} button exists`, Boolean(button));
          // Manifest coverage above inspects exportAll directly. Dedicated image
          // fixtures below exercise real raster output without making this broad
          // roundtrip suite wait for a 4096 px package image.
          if (action === "export-all") {
            continue;
          }
          button.click();
        }

        await fixture.checks(doc, JSON.parse(savedText), downloads, assets);

        win.URL.createObjectURL = originalCreateObjectURL;
        win.URL.revokeObjectURL = originalRevokeObjectURL;
        win.HTMLAnchorElement.prototype.click = originalClick;
        frame.remove();
        return saved;
      }

      async function run() {
        renderReport();
        try {
          const assets = await loadAssets();
          for (const fixture of fixtures) {
            await loadFixtureFrame(fixture, assets);
            record(`${fixture.name}: roundtrip complete`, "pass");
          }
          report.status = report.failures.length ? "fail" : "pass";
        } catch (error) {
          report.status = "fail";
          record("fixture runner", "fail", error.message || String(error));
          console.error(error);
        } finally {
          document.body.setAttribute("data-fixture-status", report.status);
          renderReport();
        }
      }

      window.addEventListener("load", run, { once: true });
    </script>
  </body>
</html>
