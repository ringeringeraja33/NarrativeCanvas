name: Verify plugin artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify root plugin artifacts
        run: node scripts/verify-plugin-artifacts.cjs
      - name: Run smoke tests
        run: node scripts/run-browser-test.cjs tests/smoke.html smoke 30000
      - name: Run fixture tests
        run: node scripts/run-browser-test.cjs tests/fixture-roundtrip.html fixture 18000
      - name: Run GUI regression tests
        run: node scripts/run-browser-test.cjs tests/gui-regression.html gui 45000
